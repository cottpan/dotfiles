# Harlequin (TUI の DB クライアント) の設定
#
# 既定のキーマップ "vscode" の上に "mykeys" を重ねて、Quit を C-q から C-t に移す。
# 理由: tmux の prefix が C-q (.tmux.conf) なので、C-q は tmux に吸われて harlequin まで届かない。
#
# キーを変えたいときは下の keys を書き換える (対話的に編集するなら `harlequin --keys`)。
# キー名は Textual の記法 (ctrl+t / f7 / shift+tab ...)。カンマ区切りで複数割り当てられる。
# vscode キーマップが空けているのは ctrl+t / ctrl+l / f7 / f11 くらい。
# (ctrl+p は Textual のコマンドパレット、ctrl+d はエディタの delete なので避ける)
#
# 注意: `harlequin --keys` の画面だけは Quit が C-q 固定でこの設定が効かない。
#       抜けるには tmux 側から literal な C-q を送る必要がある
#       (.tmux.conf に `bind q send-prefix` を足すなど)。
#
# この dotfiles の約束は「移動 = j/k, 閉じる = q, 検索 = /, ヘルプ = ?」だが、
# harlequin だけは移動しか揃えられない。SQL を打ち込むアプリなので、
# アプリ全体に効く quit / help / find を素の q / ? / / に置くと、
# エディタでその文字が打てなくなるため。
# 一方 results_viewer (結果の表) と data_catalog (左のツリー) の操作は
# そのペインにフォーカスがあるときだけ効くので、ここは vim に寄せられる。

default_profile = "mykeys"

[profiles.mykeys]
keymap_name = ["vscode", "mykeys"]

# --- 全体 -------------------------------------------------------------------

[[keymaps.mykeys]]
keys = "ctrl+t"
action = "quit"
key_display = "^t"

# --- 結果の表 (フォーカスがあるときだけ効く) --------------------------------

[[keymaps.mykeys]]
keys = "j"
action = "results_viewer.cursor_down"
key_display = "j"

[[keymaps.mykeys]]
keys = "k"
action = "results_viewer.cursor_up"
key_display = "k"

[[keymaps.mykeys]]
keys = "h"
action = "results_viewer.cursor_left"
key_display = "h"

[[keymaps.mykeys]]
keys = "l"
action = "results_viewer.cursor_right"
key_display = "l"

[[keymaps.mykeys]]
keys = "g"
action = "results_viewer.cursor_table_start"
key_display = "g"

[[keymaps.mykeys]]
keys = "G"
action = "results_viewer.cursor_table_end"
key_display = "G"

[[keymaps.mykeys]]
keys = "ctrl+d"
action = "results_viewer.cursor_page_down"
key_display = "^d"

[[keymaps.mykeys]]
keys = "ctrl+u"
action = "results_viewer.cursor_page_up"
key_display = "^u"

# --- 左のツリー (フォーカスがあるときだけ効く) ------------------------------

[[keymaps.mykeys]]
keys = "j"
action = "data_catalog.cursor_down"
key_display = "j"

[[keymaps.mykeys]]
keys = "k"
action = "data_catalog.cursor_up"
key_display = "k"

# --- ペイン移動 -------------------------------------------------------------
#
# 既定は F2 (エディタ) / F5 (結果) / F6 (ツリー) で、どれがどれか覚えられない。
# nvim のウィンドウ移動・tmux の prefix h/j/k/l と同じ「方向で動く」形にする。
#
#   ┌──────────┬──────────────┐
#   │          │ エディタ      │   C-h でツリー、C-j で結果
#   │ ツリー    ├──────────────┤
#   │          │ 結果          │   C-k でエディタ、C-h でツリー
#   └──────────┴──────────────┘
#            C-l でエディタ、C-j で結果
#
# フォーカスのあるペインの中でだけ効くので、SQL を打っている最中に
# 別のキーを奪うことはない (C-k はエディタでは既定のバッファ切り替えのまま)。

[[keymaps.mykeys]]
keys = "ctrl+h"
action = "code_editor.focus_data_catalog"
key_display = "^h"

[[keymaps.mykeys]]
keys = "ctrl+j"
action = "code_editor.focus_results_viewer"
key_display = "^j"

[[keymaps.mykeys]]
keys = "ctrl+k"
action = "results_viewer.focus_query_editor"
key_display = "^k"

[[keymaps.mykeys]]
keys = "ctrl+h"
action = "results_viewer.focus_data_catalog"
key_display = "^h"

[[keymaps.mykeys]]
keys = "ctrl+l"
action = "data_catalog.focus_query_editor"
key_display = "^l"

[[keymaps.mykeys]]
keys = "ctrl+j"
action = "data_catalog.focus_results_viewer"
key_display = "^j"
