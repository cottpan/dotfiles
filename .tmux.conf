# set-option -g utf8

# prefix は C-q
# (C-z はペインに literal で送られると Claude Code などが suspend するため使わない)
unbind C-b
set -g prefix C-q
# 二度押しは直前のウィンドウへ。send-prefix は割り当てない
# (tmux を入れ子で使うようになったら `bind q send-prefix` などを足す)
bind C-q last-window

# スクロールバックを増やす
set-option -g history-limit 50000

# メッセージ表示を長めに
set-option -g display-time 4000

# Neovim の Esc 遅延対策 (tmux 3.7 の既定は 10 だが、古い tmux では 500 なので明示する)
set-option -sg escape-time 10

# 複数クライアントが接続した時、実際に見ているクライアントに合わせてリサイズする
set-window-option -g aggressive-resize on

set-option -g status-position top

# 左側: セッション名と、prefix 入力中 / コピーモード中の状態表示
# (#{?...} の中でスタイルを書くときは、区切りと区別するためカンマを #, と書く)
set-option -g status-left "#[fg=colour235,bg=colour64]  #S #{?client_prefix,#[fg=colour64#,bg=colour160]#[fg=colour235#,bg=colour160]  #[fg=colour160#,bg=colour235],#{?pane_in_mode,#[fg=colour64#,bg=colour136]#[fg=colour235#,bg=colour136] COPY #[fg=colour136#,bg=colour235],#[fg=colour64#,bg=colour235]}}#[default] "

# 右側: 予定 / GitHub 通知 / Claude Code 使用量 / バッテリー / ネットワーク + 時計
# セグメントは bin/tmux-status-right が定期更新してキャッシュに書いたものを読むだけ。
# 時計だけは毎秒更新したいので tmux 組み込みの strftime で描く
# (${...:-...} は tmux では展開できないが、#() の中身は sh が処理するので使える。
#  そのためこの行はシングルクォートで囲む)
set-option -g status-right '#(cat "${XDG_CACHE_HOME:-$HOME/.cache}/tmux-status/right" 2>/dev/null) %H:%M:%S #[default]'
# この長さには #[...] のスタイル指定も含まれるので多めに取る
# (実際の表示幅は bin/tmux-status-right 側で端末幅に合わせて調整している)
set-option -g status-right-length 600
set-option -g status-left-length 60

set-option -g status-interval 1

# ウィンドウ一覧は中央ではなく左に寄せて、タブのように並べる
set-option -g status-justify left

# ウィンドウ・ペインの番号は 1 始まりで揃える
set-option -g base-index 1
set-window-option -g pane-base-index 1

# ウィンドウを閉じた時に番号を詰める
set-option -g renumber-windows on

#set-option -g default-shell /usr/local/bin/zsh
#set-option -g default-command /usr/local/bin/zsh

# truecolor / undercurl (Neovim の solarized と LSP 診断の表示用)
# RGB を宣言するのは対応済みの端末だけにする
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm-ghostty:RGB:usstyle"
set-option -sa terminal-features ",xterm-256color:usstyle"

# Neovim の FocusGained / autoread を効かせる
set-option -g focus-events on

set-option -g pane-active-border-style "bg=colour235"
 
#### COLOUR (Solarized 256)

# default statusbar colors
set-option -g status-bg colour235 #base02
set-option -g status-fg colour136 #yellow
# set-option -g status-attr default # This is now part of status-style

# アクティブなウィンドウは powerline のブロックで強調する
# (ズーム中は虫眼鏡を出す)
set-window-option -g window-status-current-format "#[fg=colour33,bg=colour235]#[fg=colour235,bg=colour33] #{?#{==:#{@claude_state},busy},#[fg=colour166] #[fg=colour235],}#I:#W#{?window_zoomed_flag, ,} #[fg=colour33,bg=colour235]#[default]"
set-window-option -g window-status-current-style "fg=colour235,bg=colour33"

# 非アクティブは控えめに
set-window-option -g window-status-format " #{?#{==:#{@claude_state},busy},#[fg=colour166] #[fg=colour244],}#I:#W#F "
set-window-option -g window-status-style "fg=colour244,bg=default"
set-window-option -g window-status-separator ""

# pane border
set-option -g pane-border-style "fg=colour240"  #base02
set-option -g pane-active-border-style "fg=colour246" #base01

# message text
set-option -g message-style "bg=colour235,fg=colour166" #base02 & orange

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

set-option -g mouse on

#### copy mode

# コピー先は OS で切り替える (macOS: pbcopy / Wayland: wl-copy / X11: xclip)
if-shell 'command -v pbcopy > /dev/null 2>&1' \
    'set-option -g @copy_command "pbcopy"' \
    'if-shell "command -v wl-copy > /dev/null 2>&1" \
        "set-option -g @copy_command \"wl-copy\"" \
        "set-option -g @copy_command \"xclip -selection clipboard -in\""'

set-window-option -g mode-keys vi

# v で選択開始、C-v で矩形選択
# (y とマウス選択でのコピーは tmux-yank が担当する)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Enter でもコピーできるようにする (従来の挙動)
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"

#### pane / window 操作 (tmux-pain-control 相当を自前で定義)

# 分割はカレントパスを引き継ぐ (| 縦分割 / - 横分割、\ と _ は画面全体で分割)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"
# 既定の % と " も同じ挙動に揃える
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ペイン移動 (hjkl)
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R

# ペインのリサイズ (連打可)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウの並び替え (連打可)
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# 作業用ウィンドウ (エディタ + ターミナル + エージェント) を開く
bind C run-shell '~/bin/tmux-workspace "#{pane_current_path}"'

# ステータスバーのクリック
# GitHub 通知と予定のセグメントは #[range=user|...] で囲ってあり、
# クリックすると mouse_status_range にその名前が入る。
# ウィンドウのタブをクリックした時 (range が window) は従来どおり切り替える
bind -n MouseDown1Status {
    if -F '#{==:#{mouse_status_range},gh}' {
        display-popup -E -w 85% -h 60% '~/bin/tmux-status-popup github'
    } {
        if -F '#{==:#{mouse_status_range},cal}' {
            display-popup -E -w 70% -h 50% '~/bin/tmux-status-popup calendar'
        } {
            select-window -t=
        }
    }
}

# 設定のリロード (既定の refresh-client は prefix + R に退避)
bind r source-file ~/.tmux.conf \; display-message "sourced ~/.tmux.conf"
bind R refresh-client

#### plugins (TPM)
# プラグインは set -g @plugin で追加し、prefix + I でインストール / prefix + U で更新
set -g @plugin 'tmux-plugins/tpm'

# コピーモードの y / マウス選択でシステムのクリップボードへ (OS 判定はプラグイン任せ)
# prefix + y でコマンドライン、prefix + Y でカレントパスをコピー
set -g @plugin 'tmux-plugins/tmux-yank'

# セッションの保存・復元 (prefix + C-s で保存 / prefix + C-r で復元)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# 保存の自動化。継続的に保存し、tmux サーバ起動時に復元する
# (continuum は resurrect より後に読み込ませる)
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM が無い環境では clone してから読み込む (lazy.nvim と同じ考え方の bootstrap)
if-shell '[ ! -d "$HOME/.tmux/plugins/tpm" ]' \
    'run-shell "git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.tmux/plugins/tpm && $HOME/.tmux/plugins/tpm/bin/install_plugins"'

# この run は必ずファイル末尾に置く
run '~/.tmux/plugins/tpm/tpm'

# 設定を保存したら自動で読み直す (entr が必要)
# b0o/tmux-autoreload は declare -g と realpath -e を使っていて macOS の
# 標準 bash / BSD realpath では動かないので、同等の処理を自前で持つ
run-shell -b '~/bin/tmux-watch-config'

# status-right のセグメントを定期更新する常駐プロセス
run-shell -b '~/bin/tmux-status-right --daemon'
