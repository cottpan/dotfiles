# hunk (レビュー向けのターミナル diff ビューア) の設定
#
# キーは既定でほぼ vim (j/k で移動, g/G で先頭と末尾, d/u で半ページ, / で絞り込み,
# q で終了, ? でヘルプ, [ / ] でハンク移動, { / } で注釈付きハンク, e でエディタ,
# c で注釈, z で文脈の展開) なので、この dotfiles の約束
# 「移動 = j/k, 閉じる = q, 検索 = /, ヘルプ = ?」はそのまま満たしている。
# 変えたいときは [keybindings] にコマンド ID とキーを書く (docs/keybindings.md)。

# 注釈は既定で非表示。pr-review は --agent-notes を付けて起動するが、
# 素で hunk diff を叩いたときにも出したいので既定を反転させておく
agent_notes = true

# 終了時に「表示設定を保存するか」を聞かれると、レビューのたびに一手増える。
# 設定はこのファイルで持つので聞かなくてよい
prompt_save_view_preferences = false

# 端末の配色に合わせる (Solarized 系の暗い背景)
theme = "auto"
